<div layout="column" flex>
  <div class="bgc-blue-700" [style.color]="'#fff'" layout="row" flex>
      <button md-icon-button (click)="goBack()">
          <md-icon>arrow_back</md-icon>
      </button>
      <button md-icon-button disabled>
        <md-icon>notifications_active</md-icon>
      </button>
      <div flex class="menu-showLabel">
          <span>แจ้งเตือน</span>
      </div>
  </div>
</div>
<div layout="column" flex>
  <md-sidenav-layout layout="column" flex fullscreen>
      <div class="body-showCenter">
          <div layout-gt-md="row" layout-align-gt-md="center start" class="margin main-admin">
              <div flex-gt-md="90">
                  <md-card>
                      <md-card-content>
                          <table td-data-table>
                              <th td-data-table-column>
                                <span class="column-header">ลำดับ</span>
                              </th>
                              <th td-data-table-column>
                                <span class="column-header">ข้อความแจ้งเตือน</span>
                              </th>
                              <th td-data-table-column>
                                <span class="column-header">วันที่เริ่มต้น</span>
                              </th>
                              <th td-data-table-column>
                                <span class="column-header">วันที่สิ้นสุด</span>
                              </th>
                              <th td-data-table-column>
                                <span class="column-header">การใช้งาน</span>
                              </th>
                              <tr td-data-table-row *ngFor="let alert of alerts; let i=index;" (mouseover)="hoverEdit=alert.id" (mouseleave)="hoverEdit=-1">
                                  <td td-data-table-cell width="40px">
                                      <div>{{i + 1}}</div>
                                  </td>
                                  <td td-data-table-cell>
                                      <div>{{alert.message}}</div>
                                  </td>
                                  <td td-data-table-cell width="120px">
                                    <div>{{alert.startDate}}</div>
                                  </td>
                                  <td td-data-table-cell width="120px">
                                    <div>{{alert.endDate}}</div>
                                  </td>
                                  <td td-data-table-cell width="80px">
                                    <div *ngIf="alert.active" class="active">ใช้งาน</div>
                                    <div *ngIf="!alert.active" class="inactive">ไม่ใช้งาน</div>
                                  </td>
                                  <td td-data-table-cell width="80px">
                                      <div *ngIf="hoverEdit==alert.id" style="text-align: right;" >
                                          <i class="material-icons icon-button" title="แก้ไข" (click)="edit(alert)">edit</i>
                                          <i class="material-icons icon-button" title="ลบ" (click)="delete(alert)">delete</i>
                                      </div>
                                  </td>
                              </tr>
                          </table>
                      </md-card-content>
                  </md-card>
              </div>
          </div>
      </div>
  </md-sidenav-layout>
</div>

<div hide show-gt-md layout="column" id="fixedbutton">
  <button md-fab color="accent" title="เพิ่ม" (click)="add()">
      <md-icon>add</md-icon>
  </button>
</div>

<p-growl [(value)]="msgs" [life]="5000"></p-growl>
