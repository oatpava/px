<div layout="column" flex>
  <div class="bgc-blue-700" [style.color]="'#fff'" layout="row" flex>
      <button md-icon-button (click)="goBack()">
          <md-icon>arrow_back</md-icon>
      </button>
      <button md-icon-button disabled>
        <md-icon>vpn_key</md-icon>
      </button>
      <div flex class="menu-showLabel">
          <span>ข้อมูลการเชื่อมระบบ</span>
      </div>
  </div>
</div>
<div layout="column" flex>
  <md-sidenav-layout layout="column" flex fullscreen>
      <div class="body-showCenter">
          <div layout-gt-md="row" layout-align-gt-md="center start" class="margin main-admin">
              <div flex-gt-md="90">
                  <md-card>
                      <md-card-content>
                          <table td-data-table>
                              <th td-data-table-column>
                                <span class="column-header">ลำดับ</span>
                              </th>
                              <th td-data-table-column>
                                <span class="column-header">ชื่อระบบ</span>
                              </th>
                              <th td-data-table-column>
                                <span class="column-header">Key ที่ใช้ยืนยันตัวตน</span>
                              </th>
                              <th td-data-table-column>
                                <span class="column-header">ผู้สร้าง</span>
                              </th>
                              <th td-data-table-column>
                                <span class="column-header">วันที่สร้าง</span>
                              </th>
                              <th td-data-table-column>
                                <span class="column-header">ผู้แก้ไข</span>
                              </th>
                              <th td-data-table-column>
                                <span class="column-header">วันที่แก้ไข</span>
                              </th>
                              <tr td-data-table-row *ngFor="let importProfile of importProfiles; let i=index;" (mouseover)="hoverEdit=importProfile.id" (mouseleave)="hoverEdit=-1">
                                  <td td-data-table-cell width="40px">
                                      <div>{{i + 1}}</div>
                                  </td>
                                  <td td-data-table-cell>
                                      <div>{{importProfile.name}}</div>
                                  </td>
                                  <td td-data-table-cell>
                                      <div>{{importProfile.key}}</div>
                                  </td>
                                  <td td-data-table-cell>
                                    <div>{{importProfile.creatorFullName}}</div>
                                  </td>
                                  <td td-data-table-cell width="120px">
                                    <div>{{importProfile.createdDate}}</div>
                                  </td>
                                  <td td-data-table-cell width="120px">
                                    <div *ngIf="importProfile.updatedBy">{{importProfile.updaterFullName}}</div>
                                  </td>
                                  <td td-data-table-cell width="120px">
                                    <div *ngIf="importProfile.updatedBy">{{importProfile.updatedDate}}</div>
                                  </td>
                                  <td td-data-table-cell width="80px">
                                      <div *ngIf="hoverEdit==importProfile.id" style="text-align: right;" >
                                          <i class="material-icons icon-button" title="แก้ไข" (click)="edit(importProfile)">edit</i>
                                          <i class="material-icons icon-button" title="ลบ" (click)="delete(importProfile)">delete</i>
                                      </div>
                                  </td>
                              </tr>
                          </table>
                      </md-card-content>
                  </md-card>
              </div>
          </div>
      </div>
  </md-sidenav-layout>
</div>

<div hide show-gt-md layout="column" id="fixedbutton">
  <button md-fab color="accent" title="เพิ่ม" (click)="add()">
      <md-icon>add</md-icon>
  </button>
</div>

<p-growl [(value)]="msgs" [life]="5000"></p-growl>
