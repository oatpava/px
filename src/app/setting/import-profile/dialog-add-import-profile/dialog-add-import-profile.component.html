<md-card class="dl-card dialog">
  <md-card-title class="dl-card-title" layout="row" flex>
    <div>
      <span *ngIf="importProfile.id==0">เพิ่มข้อมูลการเชื่อมระบบ</span>
      <span *ngIf="importProfile.id!=0">แก้ไขข้อมูลการเชื่อมระบบ</span>
    </div>
  </md-card-title>

  <div class="boxDialog">
    <form layout="column" #form="ngForm" layout-align="top center">
      <md-input placeholder="ชื่อระบบ" type="text" name="name" [(ngModel)]="importProfile.name" required></md-input>
    </form>
  </div>

  <md-divider></md-divider>
  
  <div class="bottomboxDialog" align="right">
      <button md-raised-button [ngClass]="{'md-primary': form.form.valid}" [disabled]="!form.form.valid" (click)="ok()">บันทึก</button>
      <button md-raised-button style="padding-left: 5px;" (click)="close()">ยกเลิก</button>
  </div>
</md-card>
